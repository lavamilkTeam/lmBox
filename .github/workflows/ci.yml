name: CI

on:
  push:
    branches: [main, kihon]
  pull_request:
    branches: [main, kihon]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install geometry engine for real browser integration tests
        run: npm run setup:geometry
      - name: Install the pinned Rust and WASM tools
        run: npm run setup:wasm
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Check boundaries, unit tests, types, build and browser behavior
        run: npm run check
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Backend Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Prepare the real geometry worker
        run: |
          python -m venv engine/.venv
          engine/.venv/bin/python -m pip install -e 'engine[dev]'
      - name: Check Rust format and reject Clippy warnings
        run: |
          cargo fmt --manifest-path src-rust/Cargo.toml --check
          cargo clippy --manifest-path src-rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test parsing, contracts, cancellation and Python integration
        run: cargo test --manifest-path src-rust/Cargo.toml --locked

  geometry:
    name: Backend Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install geometry and checking dependencies
        run: python -m pip install -e 'engine[dev]'
      - name: Check lint, module boundaries and geometry regressions
        working-directory: engine
        run: |
          ruff check src tests
          lint-imports
          pytest --junitxml=test-results/geometry.xml
      - name: Upload geometry test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: geometry-test-results
          path: engine/test-results/
          if-no-files-found: ignore
          retention-days: 7

  workflow:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test release artifact validation
        run: node --test scripts/release-assets.check.mjs

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
          - os: macos-14
            platform: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Install Linux WebKit and window system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - run: npm ci
      - run: npm run setup:geometry
      - run: npm run setup:wasm
      - name: Bundle and exercise the standalone geometry runtime
        run: |
          npm run build:worker
          npm run check:worker
      - name: Reject desktop Rust warnings and test native integration
        run: |
          cargo fmt --manifest-path desktop/tauri/Cargo.toml --check
          cargo clippy --manifest-path desktop/tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path desktop/tauri/Cargo.toml --locked
      - name: Build desktop installers and embedded frontend
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # PyInstaller normally adds this path when its worker starts. linuxdeploy scans ELF files directly.
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/desktop/tauri/resources/lmbox-geometry/_internal${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          npm run desktop:build -- --bundles "$BUNDLE_TARGETS" --verbose 2>&1 | tee desktop-build.log
      - name: Preserve installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-build-log-${{ matrix.os }}
          path: desktop-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the geometry worker extracted from the final AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installers=("$GITHUB_WORKSPACE"/desktop/tauri/target/release/bundle/appimage/*.AppImage)
          test "${#installers[@]}" -eq 1
          appimage_check_dir="$(mktemp -d)"
          trap 'rm -rf "$appimage_check_dir"' EXIT
          (cd "$appimage_check_dir" && "${installers[0]}" --appimage-extract > /dev/null)
          npm run check:worker -- "$appimage_check_dir/squashfs-root/usr/lib/lmBox/geometry"
      - name: Validate the copied application resources and preserve file permissions
        run: |
          npm run check:worker -- desktop/tauri/target/release/geometry
          node scripts/archive-desktop.mjs
      - name: Upload executable and bundled runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.os }}
          path: .tools/desktop-*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Collect installers with integrity manifests
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: node scripts/release-assets.mjs collect "$RELEASE_PLATFORM" desktop/tauri/target/release/bundle .tools/release-assets
      - name: Upload installers for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installers-${{ matrix.platform }}
          path: .tools/release-assets/
          if-no-files-found: error
          retention-days: 7

  cea:
    name: Fortran CEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Install GNU Fortran on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build
      - name: Install GNU Fortran on macOS
        if: runner.os == 'macOS'
        run: brew install gcc ninja
      - name: Install GNU Fortran on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-ninja'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile the pinned NASA Fortran core and official C ABI
        env:
          FC: gfortran
          CC: gcc
        run: npm run build:cea
      - name: Check native adapter and public contract
        run: |
          cargo fmt --manifest-path src-rust/Cargo.toml --check
          cargo clippy --manifest-path src-rust/Cargo.toml --locked --all-targets --features cea-integration -- -D warnings
          cargo test --manifest-path src-rust/Cargo.toml --locked --test cea_contract
          npm run check:cea

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [frontend, rust, geometry, workflow, desktop, cea]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if not results or failed:
              print('Quality gate failed: every mandatory job must succeed.', file=sys.stderr)
              sys.exit(1)
          PY

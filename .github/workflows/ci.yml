name: CI

on:
  push:
    branches: [main, kihon]
  pull_request:
    branches: [main, kihon]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install geometry engine for real browser integration tests
        run: npm run setup:geometry
      - name: Install the isolated AI runtime
        run: npm run setup:ai
      - name: Install the pinned Rust and WASM tools
        run: npm run setup:wasm
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Build native solvers for real propulsion browser tests
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build
          npm run build:backend
      - name: Check boundaries, unit tests, types, build and browser behavior
        run: npm run check
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Backend Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Prepare the real geometry worker
        run: |
          python -m venv engine/.venv
          engine/.venv/bin/python -m pip install -e 'engine[dev]'
      - name: Check Rust format and reject Clippy warnings
        run: |
          cargo fmt --manifest-path src-rust/Cargo.toml --check
          cargo clippy --manifest-path src-rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test parsing, contracts, cancellation and Python integration
        run: cargo test --manifest-path src-rust/Cargo.toml --locked

  geometry:
    name: Backend Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install geometry and checking dependencies
        run: python -m pip install -e 'engine[dev,ai]'
      - name: Check lint, module boundaries and geometry regressions
        working-directory: engine
        run: |
          ruff check src tests
          lint-imports
          pytest --junitxml=test-results/geometry.xml
      - name: Check CFD source and runtime build scripts
        run: ruff check scripts/cfd-runtime scripts/bundle-cfd-runtime.py scripts/bundle-cfd-runtime.check.py scripts/check-cfd-runtime.py scripts/prepare-openfoam-source.py scripts/prepare-openfoam-source.check.py
      - name: Upload geometry test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: geometry-test-results
          path: engine/test-results/
          if-no-files-found: ignore
          retention-days: 7

  workflow:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test release artifact validation
        run: node --test scripts/release-assets.check.mjs
      - name: Validate case-safe OpenFOAM source preparation
        run: |
          python -B scripts/prepare-openfoam-source.check.py -v
          python -B scripts/prepare-openfoam-source.py
          python -B scripts/prepare-openfoam-source.py --check
          git diff --exit-code -- runtime/openfoam/case-map.json

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
            qt-host: linux
            qt-arch: linux_gcc_64
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
            qt-host: windows
            qt-arch: win64_msvc2022_64
          - os: macos-14
            platform: macos-arm64
            bundles: app,dmg
            qt-host: mac
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Test native CFD bundle validation on macOS
        if: runner.os == 'macOS'
        run: |
          python -B scripts/bundle-cfd-runtime.check.py
          python -B scripts/prepare-openfoam-source.check.py -v
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Install Linux WebKit and window system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64 gfortran cmake ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth
      - run: npm ci
      - run: npm run setup:geometry
      - run: npm run setup:ai
      - run: npm run setup:wasm
      - name: Bundle and exercise the standalone geometry runtime
        run: |
          npm run build:worker
          npm run check:worker
          npm run build:ai-worker
          npm run check:ai-worker
      - name: Validate signed module installation and desktop loading
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/modules/Cargo.toml --check
          cargo clippy --manifest-path desktop/modules/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path desktop/modules/Cargo.toml --locked
          cargo clippy --manifest-path desktop/tauri/Cargo.toml --locked --all-targets --features modular -- -D warnings
      - name: Reject desktop Rust warnings and test native integration
        run: |
          cargo fmt --manifest-path desktop/tauri/Cargo.toml --check
          cargo clippy --manifest-path desktop/tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path desktop/tauri/Cargo.toml --locked
      - name: Build desktop installers and embedded frontend
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # PyInstaller normally adds this path when its worker starts. linuxdeploy scans ELF files directly.
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/desktop/tauri/resources/lmbox-geometry/_internal:$GITHUB_WORKSPACE/desktop/tauri/resources/lmbox-ai/_internal${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          npm run desktop:build -- --bundles "$BUNDLE_TARGETS" --verbose 2>&1 | tee desktop-build.log
      - name: Preserve installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-build-log-${{ matrix.os }}
          path: desktop-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the geometry worker extracted from the final AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installers=("$GITHUB_WORKSPACE"/desktop/tauri/target/release/bundle/appimage/*.AppImage)
          test "${#installers[@]}" -eq 1
          appimage_check_dir="$(mktemp -d)"
          trap 'rm -rf "$appimage_check_dir"' EXIT
          (cd "$appimage_check_dir" && "${installers[0]}" --appimage-extract > /dev/null)
          npm run check:worker -- "$appimage_check_dir/squashfs-root/usr/lib/lmBox/geometry"
          npm run check:ai-worker -- "$appimage_check_dir/squashfs-root/usr/lib/lmBox/ai"
      - name: Validate the copied application resources and preserve file permissions
        run: |
          npm run check:worker -- desktop/tauri/target/release/geometry
          npm run check:ai-worker -- desktop/tauri/target/release/ai
          node scripts/archive-desktop.mjs
      - name: Upload executable and bundled runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.os }}
          path: .tools/desktop-*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Collect installers with integrity manifests
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: node scripts/release-assets.mjs collect "$RELEASE_PLATFORM" desktop/tauri/target/release/bundle .tools/release-assets
      - name: Upload installers for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installers-${{ matrix.platform }}
          path: .tools/release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Install the module solver compiler on macOS
        if: runner.os == 'macOS'
        run: brew install gcc ninja
      - name: Install the module solver compiler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-ninja'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build real solver runtimes and fetch the pinned CFD source
        env:
          FC: gfortran
          CC: gcc
        run: |
          npm run build:backend
          node scripts/setup-cfd.mjs --source-only
      - name: Prepare compiler runtime license notices
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p .tools/compiler-licenses
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp /usr/share/doc/libgfortran5/copyright .tools/compiler-licenses/gcc-copyright
            cp /usr/share/common-licenses/GPL-3 .tools/compiler-licenses/
            cp /usr/share/common-licenses/LGPL-2.1 .tools/compiler-licenses/
          else
            # MSYS2 GCC ships runtime notices in separate packages.
            for runtime_package in libgcc libgfortran libquadmath libstdc++ libwinpthread; do
              cp -R "/c/msys64/ucrt64/share/licenses/$runtime_package" .tools/compiler-licenses/
            done
          fi
          echo "LMBOX_COMPILER_LICENSE_DIR=$GITHUB_WORKSPACE/.tools/compiler-licenses" >> "$GITHUB_ENV"
      - name: Install the pinned Qt SDK for the native download installer
        env:
          QT_HOST: ${{ matrix.qt-host }}
          QT_ARCH: ${{ matrix.qt-arch }}
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0
          qt_archives=(qtbase qtdeclarative qttools qtsvg)
          if [ "$RUNNER_OS" = "Linux" ]; then
            # The Qt SDK requires ICU 73; Ubuntu 24.04 provides ICU 74.
            qt_archives+=(icu)
          fi
          python -m aqt install-qt "$QT_HOST" desktop 6.8.3 "$QT_ARCH" --outputdir .tools/qt --archives "${qt_archives[@]}"
          python - <<'PY'
          import glob, os, pathlib, subprocess
          tools = glob.glob('.tools/qt/6.8.3/*/bin/qmake') + glob.glob('.tools/qt/6.8.3/*/bin/qmake.exe')
          assert len(tools) == 1, tools
          qmake = pathlib.Path(tools[0]).resolve()
          subprocess.run([str(qmake), '-query', 'QT_VERSION'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as env:
              env.write(f'QMAKE={qmake}\nQTDIR={qmake.parent.parent}\n')
          PY
      - name: Build separate optional module ZIPs and the download-only installer
        env:
          LMBOX_MODULE_PUBLIC_KEY: ${{ vars.LMBOX_MODULE_PUBLIC_KEY }}
          LMBOX_MODULE_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        shell: bash
        run: |
          npm run modules:package
          npm run installer:package
          node scripts/module-package.mjs installer-archive
      - name: Validate and exercise the archived module release set
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          module_target="$(node -p 'process.platform + "-" + process.arch')"
          node scripts/release-assets.mjs collect-modules "$RELEASE_PLATFORM" "dist-modules/$module_target" .tools/module-release-assets
          python - <<'PY'
          import glob, json, pathlib, shutil, subprocess, tempfile, zipfile, os, stat, sys
          root = pathlib.Path(tempfile.mkdtemp(prefix='lmbox-modules-relocated-'))
          try:
              catalogs = glob.glob('dist-modules/*/catalog-*.payload.json')
              assert len(catalogs) == 1
              catalog_path = pathlib.Path(catalogs[0])
              catalog = json.loads(catalog_path.read_text())
              for definition in catalog['packages']:
                  archive = catalog_path.parent / definition['file']
                  with zipfile.ZipFile(archive) as package:
                      identifier = json.loads(package.read('package.json'))['id']
                      assert identifier == definition['id']
                      if identifier == 'base':
                          assert not any('/geometry/' in name or '/ai/' in name or name.endswith('.wasm') for name in package.namelist()), 'Base package includes optional resources'
                      for item in package.infolist():
                          destination = root / f'lmbox-{identifier}' / item.filename
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          mode = item.external_attr >> 16
                          if stat.S_ISLNK(mode):
                              destination.symlink_to(package.read(item).decode())
                          else:
                              destination.write_bytes(package.read(item))
                              destination.chmod(mode & 0o777)
              def module(name):
                  return root / f'lmbox-{name}'
              subprocess.run(['node', 'scripts/check-worker.mjs', str(module('stencil') / 'geometry')], check=True)
              subprocess.run(['node', 'scripts/check-ai-worker.mjs', str(module('ai-runtime') / 'ai')], check=True)
              env = dict(os.environ, LMBOX_CEA_RUNTIME=str(module('propulsion-runtime') / 'solvers/cea/runtime'), LMBOX_PROPULSION_RUNTIME=str(module('propulsion-runtime') / 'solvers/propulsion/runtime'))
              env.pop('LD_LIBRARY_PATH', None)
              env.pop('DYLD_LIBRARY_PATH', None)
              if os.name == 'nt':
                  env['PATH'] = os.pathsep.join([str(pathlib.Path(env['SystemRoot']) / 'System32'), env['SystemRoot']])
              compiled = subprocess.run(['cargo', 'test', '--manifest-path', 'src-rust/Cargo.toml', '--locked', '--features', 'cea-integration', '--test', 'cea_native', '--test', 'propulsion_native', '--no-run', '--message-format=json'], capture_output=True, text=True)
              if compiled.returncode:
                  print(compiled.stdout, file=sys.stderr)
                  print(compiled.stderr, file=sys.stderr)
                  compiled.check_returncode()
              tests = [item['executable'] for line in compiled.stdout.splitlines() if (item := json.loads(line)).get('reason') == 'compiler-artifact' and item.get('executable') and item.get('target', {}).get('name') in ('cea_native', 'propulsion_native')]
              assert len(tests) == 2, tests
              for executable in tests:
                  subprocess.run([executable], env=env, check=True)
              installers = glob.glob('dist-modules/*/lmBox-*-module-installer.zip')
              assert len(installers) == 1
              installer_root = root / 'installer'
              with zipfile.ZipFile(installers[0]) as package:
                  for item in package.infolist():
                      destination = installer_root / item.filename
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      mode = item.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          destination.symlink_to(package.read(item).decode())
                      else:
                          destination.write_bytes(package.read(item))
                          destination.chmod(mode & 0o777)
              executables = [path for path in installer_root.rglob('*') if path.is_file() and path.name in ('lmbox-installer', 'lmbox-installer.exe')]
              assert len(executables) == 1, executables
              smoke_env = dict(os.environ, QT_QUICK_BACKEND='software')
              for name in ('LD_LIBRARY_PATH', 'DYLD_LIBRARY_PATH', 'QT_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH'):
                  smoke_env.pop(name, None)
              smoke_command = [str(executables[0]), '--smoke-test']
              if sys.platform == 'linux':
                  # Exercise the xcb plugin shipped by Qt's deployment script.
                  smoke_env['QT_QPA_PLATFORM'] = 'xcb'
                  smoke_command = ['xvfb-run', '--auto-servernum', *smoke_command]
                  linked = subprocess.check_output(['ldd', str(executables[0])], env=smoke_env, text=True)
                  dependencies = dict(line.strip().split(' => ', 1) for line in linked.splitlines() if ' => ' in line)
                  for library in ('libicui18n.so.73', 'libicuuc.so.73', 'libicudata.so.73'):
                      resolved = dependencies.get(library, '').split(' (', 1)[0]
                      assert resolved and pathlib.Path(resolved).is_file(), f'Missing archived dependency: {library}\n{linked}'
                      assert pathlib.Path(resolved).resolve().is_relative_to(installer_root.resolve()), f'{library} resolves outside the installer: {resolved}'
              else:
                  smoke_env.pop('QT_QPA_PLATFORM', None)
              subprocess.run(smoke_command, env=smoke_env, check=True, timeout=30)
              print('Relocated Qt module installer loaded its QML successfully.')
          finally:
              shutil.rmtree(root)
          PY
      - name: Upload complete module release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: modules-${{ matrix.platform }}
          path: .tools/module-release-assets/
          if-no-files-found: error
          retention-days: 7

  cea:
    name: Fortran CEA (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the pinned Rust toolchain in a fresh directory
        shell: bash
        run: |
          task_rustup_dir="$(mktemp -d "$RUNNER_TEMP/lmbox-rustup.XXXXXX")"
          task_rust_channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          echo "RUSTUP_HOME=$task_rustup_dir" >> "$GITHUB_ENV"
          export RUSTUP_HOME="$task_rustup_dir"
          rustup toolchain install "$task_rust_channel" --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version
      - name: Install GNU Fortran on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build
      - name: Install GNU Fortran on macOS
        if: runner.os == 'macOS'
        run: brew install gcc ninja
      - name: Install GNU Fortran on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-ninja'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the in-repository Fortran core and Rust backend
        env:
          FC: gfortran
          CC: gcc
        run: npm run build:backend
      - name: Check native adapter and public contract
        run: |
          cargo fmt --manifest-path src-rust/Cargo.toml --check
          cargo clippy --manifest-path src-rust/Cargo.toml --locked --all-targets --features cea-integration -- -D warnings
          cargo test --manifest-path src-rust/Cargo.toml --locked --test cea_contract
          npm run check:cea
          npm run check:propulsion

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [frontend, rust, geometry, workflow, desktop, cea]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if not results or failed:
              print('Quality gate failed: every mandatory job must succeed.', file=sys.stderr)
              sys.exit(1)
          PY

name: Release

on:
  push:
    tags: ['v*', 'demov*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Require a matching version already integrated into the default branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/release-assets.mjs validate-tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish complete release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installers-*
          path: .tools/downloaded-installers
      - name: Verify every platform, source commit and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-assets.mjs validate-tag "$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          node scripts/release-assets.mjs assemble .tools/downloaded-installers .tools/publish
      - name: Upload all assets before making the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > .tools/release-state.json; then
            node -e "if (!JSON.parse(require('fs').readFileSync('.tools/release-state.json')).isDraft) throw new Error('Published releases cannot be overwritten; use a new version tag')"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "lmBox $RELEASE_TAG" --generate-notes --notes-file .github/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" .tools/publish/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

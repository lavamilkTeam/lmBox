[package]
name = "lmbox-modules"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
fs2 = "0.4"
dirs = "6"

[profile.release]
strip = true

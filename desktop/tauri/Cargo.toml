[package]
name = "lmbox-desktop"
version = "0.1.1"
edition = "2021"
publish = false
default-run = "lmbox-desktop"

[dependencies]
lmbox = { path = "../../src-rust" }
serde_json = "1"
lmbox-modules = { path = "../modules" }
tauri = { version = "2", features = [] }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
modular = []

[profile.release]
strip = true

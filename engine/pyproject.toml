[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmbox-geometry"
version = "0.2.4"
requires-python = ">=3.9"
dependencies = ["shapely==2.0.7", "trimesh==4.5.3", "mapbox-earcut==1.0.3", "numpy==2.0.2", "jsonschema==4.23.0", "manifold3d==3.0.1"]

[project.optional-dependencies]
bundle = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]
dev = ["pytest==8.3.5", "ruff==0.11.13", "import-linter==2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.importlinter]
root_package = "lmbox_geometry"

[[tool.importlinter.contracts]]
name = "Application owns coordination"
type = "layers"
layers = ["lmbox_geometry.modules.stencil.application", "lmbox_geometry.modules.stencil.features | lmbox_geometry.modules.stencil.runtime", "lmbox_geometry.contracts"]

[[tool.importlinter.contracts]]
name = "Features stay independent"
type = "independence"
modules = ["lmbox_geometry.modules.stencil.features.modeling", "lmbox_geometry.modules.stencil.features.inspection", "lmbox_geometry.modules.stencil.features.export_3d", "lmbox_geometry.modules.stencil.features.export_2d"]

[[tool.importlinter.contracts]]
name = "Stencil internals stay private"
type = "forbidden"
source_modules = ["lmbox_geometry.modules.stencil.application", "lmbox_geometry.modules.stencil.runtime", "lmbox_geometry.modules.stencil.features.inspection", "lmbox_geometry.modules.stencil.features.export_3d", "lmbox_geometry.modules.stencil.features.export_2d"]
forbidden_modules = ["lmbox_geometry.modules.stencil.features.modeling._pipeline", "lmbox_geometry.modules.stencil.features.modeling._contours", "lmbox_geometry.modules.stencil.features.modeling._editing", "lmbox_geometry.modules.stencil.features.modeling._frame", "lmbox_geometry.modules.stencil.features.modeling._solid", "lmbox_geometry.modules.stencil.features.modeling._xy_scaling"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "3D export internals stay private"
type = "forbidden"
source_modules = ["lmbox_geometry.modules.stencil.application", "lmbox_geometry.modules.stencil.runtime", "lmbox_geometry.modules.stencil.features.modeling", "lmbox_geometry.modules.stencil.features.inspection", "lmbox_geometry.modules.stencil.features.export_2d"]
forbidden_modules = ["lmbox_geometry.modules.stencil.features.export_3d._stl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "2D export internals stay private"
type = "forbidden"
source_modules = ["lmbox_geometry.modules.stencil.application", "lmbox_geometry.modules.stencil.runtime", "lmbox_geometry.modules.stencil.features.modeling", "lmbox_geometry.modules.stencil.features.inspection", "lmbox_geometry.modules.stencil.features.export_3d"]
forbidden_modules = ["lmbox_geometry.modules.stencil.features.export_2d._formats"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Process adapter uses the stencil module facade"
type = "forbidden"
source_modules = ["lmbox_geometry.runner", "lmbox_geometry.contracts"]
forbidden_modules = ["lmbox_geometry.modules.stencil.application", "lmbox_geometry.modules.stencil.features", "lmbox_geometry.modules.stencil.runtime"]
allow_indirect_imports = true
